[project]
name = "multi-tenant-llm-platform"
version = "0.1.0"
description = "Multi-Tenant LLM Serving Platform deepened core modules"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "redis>=5.0",
  "scikit-learn>=1.5",
  "starlette>=1.0",
  "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["catalog*", "gateway*", "controller*", "observability*", "bench*", "deploy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["catalog", "gateway", "controller", "bench", "observability", "deploy", "tests"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
