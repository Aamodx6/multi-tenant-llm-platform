apiVersion: v1
kind: Service
metadata:
  name: request-control-stable
  namespace: llm
spec:
  selector:
    app: request-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: request-control-canary
  namespace: llm
spec:
  selector:
    app: request-control
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: request-control
  namespace: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: request-control
  strategy:
    canary:
      canaryService: request-control-canary
      stableService: request-control-stable
      steps:
      - setWeight: 5
      - pause:
          duration: 2m
      - setWeight: 25
      - analysis:
          templates:
          - templateName: request-control-ttft-slo
      - setWeight: 100
  template:
    metadata:
      labels:
        app: request-control
    spec:
      containers:
      - name: request-control
        image: ghcr.io/multi-tenant-llm/request-control:latest
        ports:
        - containerPort: 8080
        env:
        - name: CACHE_SALT_SECRET
          valueFrom:
            secretKeyRef:
              name: request-control-secrets
              key: cache-salt-secret
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: request-control-ttft-slo
  namespace: llm
spec:
  metrics:
  - name: p95-ttft-slo
    interval: 30s
    count: 4
    successCondition: result[0] <= 0.600
    provider:
      prometheus:
        address: http://prometheus-operated.monitoring:9090
        query: histogram_quantile(0.95, sum(rate(gateway_ttft_seconds_bucket[2m]))
          by (le))
