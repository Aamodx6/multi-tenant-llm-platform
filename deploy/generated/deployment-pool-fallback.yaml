apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-pool-fallback
  namespace: llm
  labels:
    app: vllm
    pool: pool-fallback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
      pool: pool-fallback
  template:
    metadata:
      labels:
        app: vllm
        pool: pool-fallback
    spec:
      terminationGracePeriodSeconds: 180
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.9.0
        args:
        - --model
        - /models/qwen--qwen2.5-1.5b-instruct
        - --served-model-name
        - Qwen/Qwen2.5-1.5B-Instruct
        - --dtype
        - auto
        - --max-model-len
        - '4096'
        - --gpu-memory-utilization
        - '0.85'
        - --enable-prefix-caching
        - --prefix-caching-hash-algo
        - sha256
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
            memory: 16Gi
            cpu: '4'
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: model-cache
          mountPath: /models
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 3
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 15
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: model-cache
        hostPath:
          path: /mnt/nvme/models
          type: DirectoryOrCreate
      initContainers:
      - name: wait-model-weights
        image: busybox:1.36
        command:
        - /bin/sh
        - -c
        - until [ -f /models/qwen--qwen2.5-1.5b-instruct/.ready ]; do sleep 2; done
        volumeMounts:
        - name: model-cache
          mountPath: /models
