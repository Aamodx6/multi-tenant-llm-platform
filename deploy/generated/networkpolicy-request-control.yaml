apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: request-control-isolation
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: request-control
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: vllm
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.20.0.0/16
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5432
