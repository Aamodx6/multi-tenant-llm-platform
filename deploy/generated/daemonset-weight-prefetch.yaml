apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: weight-prefetch
  namespace: llm
  labels:
    app: weight-prefetch
spec:
  selector:
    matchLabels:
      app: weight-prefetch
  template:
    metadata:
      labels:
        app: weight-prefetch
    spec:
      serviceAccountName: weight-prefetcher
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.present: 'true'
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      initContainers:
      - name: copy-s5cmd
        image: peakcom/s5cmd:v2.3.0
        command:
        - cp
        - /s5cmd
        - /tools/s5cmd
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tools
          mountPath: /tools
      containers:
      - name: s5cmd-prefetch
        image: alpine:3.20
        command:
        - /bin/sh
        - -c
        - "set -eu\nmkdir -p /models/.locks /models/.staging\nprintf \"%s\\n\" \"\
          $PREFETCH_TARGETS\" | while IFS=\"$(printf '\\t')\" read -r rel uri; do\n\
          \  [ -n \"$rel\" ] || continue\n  lock_name=$(printf \"%s\" \"$rel\" | tr\
          \ \"/\" \"_\")\n  flock \"/models/.locks/${lock_name}.lock\" /bin/sh -c\
          \ '\n    rel=\"$1\"; uri=\"$2\"; lock_name=\"$3\"\n    if [ ! -f \"/models/${rel}/.ready\"\
          \ ]; then\n      stage=\"/models/.staging/${lock_name}.$$\"\n      trap\
          \ \"rm -rf \\\"$stage\\\"\" EXIT\n      mkdir -p \"$stage\"\n      /tools/s5cmd\
          \ cp --concurrency 32 \"${uri}/*\" \"$stage/\"\n      (ls \"$stage\"/*.safetensors\
          \ >/dev/null 2>&1 || ls \"$stage\"/adapter_model* >/dev/null 2>&1)\n   \
          \   touch \"$stage/.ready\"\n      mkdir -p \"$(dirname \"/models/${rel}\"\
          )\"\n      rm -rf \"/models/${rel}.old\"\n      ([ ! -e \"/models/${rel}\"\
          \ ] || mv \"/models/${rel}\" \"/models/${rel}.old\")\n      mv \"$stage\"\
          \ \"/models/${rel}\"\n      rm -rf \"/models/${rel}.old\"\n      trap -\
          \ EXIT\n    fi\n  ' sh \"$rel\" \"$uri\" \"$lock_name\"\ndone\nexec sleep\
          \ infinity"
        env:
        - name: PREFETCH_TARGETS
          value: "qwen--qwen2.5-7b-instruct\ts3://llm-model-weights/Qwen/Qwen2.5-7B-Instruct\n\
            qwen--qwen2.5-7b-instruct-awq\ts3://llm-model-weights/Qwen/Qwen2.5-7B-Instruct-AWQ\n\
            qwen--qwen2.5-1.5b-instruct\ts3://llm-model-weights/Qwen/Qwen2.5-1.5B-Instruct"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: model-cache
          mountPath: /models
        - name: tools
          mountPath: /tools
      volumes:
      - name: model-cache
        hostPath:
          path: /mnt/nvme/models
          type: DirectoryOrCreate
      - name: tools
        emptyDir: {}
