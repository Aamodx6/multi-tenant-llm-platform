apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-inference
spec:
  template:
    metadata:
      labels:
        nvidia.com/gpu.present: 'true'
    spec:
      taints:
      - key: nvidia.com/gpu
        value: 'true'
        effect: NoSchedule
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - spot
        - on-demand
      - key: karpenter.k8s.aws/instance-family
        operator: In
        values:
        - g6
        - g5
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-nvme
  limits:
    nvidia.com/gpu: '16'
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-nvme
spec:
  amiSelectorTerms:
  - alias: al2023@latest
  role: llm-prod-eks-karpenter-node
  subnetSelectorTerms:
  - tags:
      karpenter.sh/discovery: llm-prod-eks
  securityGroupSelectorTerms:
  - tags:
      karpenter.sh/discovery: llm-prod-eks
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      volumeSize: 100Gi
      volumeType: gp3
      deleteOnTermination: true
